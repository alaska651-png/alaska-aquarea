name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: python -m pip install aiohttp==3.14.5
      - run: npm run build && npm test && node --check dist/alaska-aquarea.js
      - run: python -m unittest discover -s coordinator -p 'test_*.py'
      - run: python -m compileall -q coordinator companion aquarea-clima
      - run: python -c "import xml.etree.ElementTree as ET; ET.parse('docs/aquarea-clima-sinottico.svg')"
      - run: git diff --exit-code -- dist/alaska-aquarea.js
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: plugin
